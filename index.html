<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代號鳶 - 操作記錄儀</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f3ed;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background-color: #fbf8f3;
      padding: 20px;
      border-radius: 12px;
    }

    .table-container { overflow-x: auto; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background-color: #ebd3b0; }
    th, td { border: 1px solid #c8a882; text-align: center; padding: 4px; min-width: 65px; font-size: 13px; }

    .round-header { background-color: #e5c49b; font-weight: bold; width: 60px; }
    tbody tr:nth-child(even) { background-color: #f0dbbe; }

    .agent-header-btn {
      width: 100%; height: 50px; border: 1px solid #b5926c; background: #f7e3c8;
      border-radius: 6px; cursor: pointer; display: flex; align-items: center; 
      justify-content: center; padding: 4px; box-sizing: border-box;
      font-size: 14px; font-weight: bold; color: #5c4033; word-break: break-all;
    }

    /* 單元格樣式 */
    .cell-btn {
      width: 100%; min-height: 40px; border: none; background: transparent; cursor: pointer;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: 2px; font-size: 12px; font-weight: bold; padding: 2px;
    }

    .btn-delete { background: none; border: none; color: #a66060; cursor: pointer; font-size: 16px; }
    .actions { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .btn-add { background-color: #f7d5a3; border: 2px solid #c89c68; border-radius: 20px; padding: 8px 24px; font-weight: bold; color: #5c4033; cursor: pointer; }
    .tool-links { display: flex; gap: 20px; font-size: 14px; color: #7a5c43; }
    .tool-links span { cursor: pointer; text-decoration: underline; }

    /* 彈窗樣式 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: flex-end;
      z-index: 999;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: #fff; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0;
      padding: 20px; box-sizing: border-box; max-height: 85vh; overflow-y: auto;
    }

    .modal-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; margin-bottom: 12px; }
    .modal-close { cursor: pointer; font-size: 18px; color: #999; }

    /* 1~9 個順序格子網格 */
    .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
    .slot-item {
      border: 1px solid #ccc; background: #fafafa; border-radius: 8px; padding: 8px 4px;
      text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center;
    }
    .slot-item.active { border-color: #e6a23c; background-color: #fdf6ec; }
    .slot-num { font-size: 11px; color: #888; margin-bottom: 4px; }
    .slot-val { font-size: 14px; font-weight: bold; color: #333; min-height: 20px; }

    /* 符號選擇區 */
    .symbol-selector {
      border-top: 1px solid #eee; padding-top: 12px; margin-top: 10px;
    }
    .symbols-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
    .sym-btn {
      border: 1px solid #ddd; background: #fff; padding: 10px; border-radius: 6px;
      font-size: 15px; font-weight: bold; cursor: pointer; text-align: center;
    }
    .sym-btn.selected { border-color: #e6a23c; background-color: #e6a23c; color: #fff; }

    .color-section { margin: 15px 0; font-size: 13px; display: flex; align-items: center; gap: 10px; }
    .color-opt { width: 22px; height: 22px; border-radius: 50%; display: inline-block; cursor: pointer; border: 2px solid transparent; }
    .color-opt.selected { border-color: #333; }

    .btn-confirm { width: 100%; background: #f5a623; color: white; border: none; padding: 12px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h2>代號鳶 - 操作記錄儀</h2>

  <div class="table-container">
    <table id="recordTable">
      <thead>
        <tr>
          <th class="round-header">回合</th>
          <th><button class="agent-header-btn" onclick="setAgentName(this)">請輸入<br>密探</button></th>
          <th><button class="agent-header-btn" onclick="setAgentName(this)">請輸入<br>密探</button></th>
          <th><button class="agent-header-btn" onclick="setAgentName(this)">請輸入<br>密探</button></th>
          <th><button class="agent-header-btn" onclick="setAgentName(this)">請輸入<br>密探</button></th>
          <th><button class="agent-header-btn" onclick="setAgentName(this)">請輸入<br>密探</button></th>
          <th style="border:none; background:transparent; width: 20px;"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="actions">
    <button class="btn-add" onclick="addRound()">添加回合</button>
    <div class="tool-links">
      <span onclick="clearAll()">全部清除</span>
    </div>
  </div>
</div>

<!-- 操作選擇彈窗 -->
<div class="modal-overlay" id="optionModal">
  <div class="modal-content">
    <div class="modal-header">
      <span>操作內容選擇</span>
      <span class="modal-close" onclick="closeOptionModal()">✕</span>
    </div>
    <div style="font-size: 12px; color: #666; margin-bottom: 10px;">點擊下方 1~9 個空格，再選擇對應的操作：</div>

    <!-- 1~9 格子 -->
    <div class="slots-grid" id="slotsGrid"></div>

    <!-- 符號選擇面板 -->
    <div class="symbol-selector">
      <div style="font-size: 12px; font-weight: bold; color: #5c4033;" id="currentSlotLabel">選擇位置 1 的操作：</div>
      <div class="symbols-grid" id="symbolsGrid"></div>
    </div>

    <div class="color-section">
      <span>背景色：</span>
      <span class="color-opt selected" style="background:#ffffff;" onclick="selectColor('', this)"></span>
      <span class="color-opt" style="background:#ffeb3b;" onclick="selectColor('#ffeb3b', this)"></span>
      <span class="color-opt" style="background:#ff4081;" onclick="selectColor('#ff4081', this)"></span>
      <span class="color-opt" style="background:#b2ff59;" onclick="selectColor('#b2ff59', this)"></span>
      <span class="color-opt" style="background:#64b5f6;" onclick="selectColor('#64b5f6', this)"></span>
    </div>

    <button class="btn-confirm" onclick="saveCellData()">確認</button>
  </div>
</div>

<script>
  let roundCount = 0;
  let currentTargetCell = null;
  let activeSlotIndex = 0; // 當前選中的是第幾個空格 (0~8)
  let slotValues = Array(9).fill(''); // 儲存 9 個空格各自的符號
  let tempColor = '';

  // 選擇符號選單
  const availableSymbols = ['清除', 'A', '↑', '↓', '圈', '技能', '普攻', '防禦'];

  function init() {
    for (let i = 0; i < 3; i++) addRound();
    renderSymbolsGrid();
  }

  function setAgentName(btn) {
    const currentName = btn.innerText.includes("請輸入") ? "" : btn.innerText;
    const inputName = prompt("請輸入密探名字：", currentName);
    if (inputName !== null) {
      btn.innerHTML = inputName.trim() === "" ? "請輸入<br>密探" : inputName.trim();
    }
  }

  function addRound() {
    roundCount++;
    const tbody = document.getElementById('tableBody');
    const tr = document.createElement('tr');
    let cellsHtml = '';
    for (let i = 0; i < 5; i++) {
      cellsHtml += `<td><button class="cell-btn" onclick="openOptionModal(this)"></button></td>`;
    }
    tr.innerHTML = `<td class="round-header">${roundCount}回合</td>` + cellsHtml + 
      `<td style="border:none; background:transparent;"><button class="btn-delete" onclick="deleteRow(this)">🗑️</button></td>`;
    tbody.appendChild(tr);
  }

  // 渲染 1~9 個空格
  function renderSlotsGrid() {
    const grid = document.getElementById('slotsGrid');
    grid.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const val = slotValues[i] || '請選擇';
      const isActive = i === activeSlotIndex ? 'active' : '';
      grid.innerHTML += `
        <div class="slot-item ${isActive}" onclick="setActiveSlot(${i})">
          <div class="slot-num">${i + 1}</div>
          <div class="slot-val">${val}</div>
        </div>
      `;
    }
    document.getElementById('currentSlotLabel').innerText = `選擇位置 ${activeSlotIndex + 1} 的操作：`;
    updateSymbolButtonsUI();
  }

  // 渲染符號選擇按鈕
  function renderSymbolsGrid() {
    const grid = document.getElementById('symbolsGrid');
    grid.innerHTML = availableSymbols.map(sym => `
      <button class="sym-btn" onclick="selectSymbol('${sym}')">${sym}</button>
    `).join('');
  }

  function setActiveSlot(index) {
    activeSlotIndex = index;
    renderSlotsGrid();
  }

  function selectSymbol(sym) {
    if (sym === '清除') {
      slotValues[activeSlotIndex] = '';
    } else {
      slotValues[activeSlotIndex] = sym;
    }
    renderSlotsGrid();
  }

  function updateSymbolButtonsUI() {
    const currentVal = slotValues[activeSlotIndex];
    document.querySelectorAll('.sym-btn').forEach(btn => {
      btn.classList.toggle('selected', btn.innerText === currentVal);
    });
  }

  function openOptionModal(btn) {
    currentTargetCell = btn;
    slotValues = btn.dataset.slots ? JSON.parse(btn.dataset.slots) : Array(9).fill('');
    tempColor = btn.dataset.color || '';
    activeSlotIndex = 0;
    
    renderSlotsGrid();
    document.getElementById('optionModal').classList.add('active');
  }

  function closeOptionModal() {
    document.getElementById('optionModal').classList.remove('active');
  }

  function selectColor(color, el) {
    tempColor = color;
    document.querySelectorAll('.color-opt').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
  }

  function saveCellData() {
    if (currentTargetCell) {
      currentTargetCell.dataset.slots = JSON.stringify(slotValues);
      currentTargetCell.dataset.color = tempColor;

      // 提取非空的內容顯示在表格中
      const displayVals = slotValues.filter(v => v !== '');
      currentTargetCell.innerText = displayVals.join(' ');
      currentTargetCell.parentElement.style.backgroundColor = tempColor || 'transparent';
    }
    closeOptionModal();
  }

  function deleteRow(btn) {
    btn.closest('tr').remove();
    reindexRounds();
  }

  function reindexRounds() {
    roundCount = 0;
    document.querySelectorAll('#tableBody tr').forEach(row => {
      roundCount++;
      row.querySelector('.round-header').innerText = `${roundCount}回合`;
    });
  }

  function clearAll() {
    if (confirm("確定要清空嗎？")) {
      document.querySelectorAll('.cell-btn').forEach(btn => {
        btn.innerText = '';
        btn.dataset.slots = '';
        btn.dataset.color = '';
        btn.parentElement.style.backgroundColor = 'transparent';
      });
    }
  }

  window.onload = init;
</script>

</body>
</html>
